  <path d="M90 95h222M90 207h222" stroke="#93c5fd" stroke-dasharray="8 8" stroke-width="3"/>
  <text x="207" y="146" text-anchor="middle" fill="#065f46" font-family="Arial,sans-serif" font-size="20" font-weight="700">КАРТКА</text>
